name: Build SPACE ANTI-CHEAT APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          unzip -o SPACE_ANTI_CHEAT_Kotlin_Project.zip -d extracted
          PROJECT_FILE="$(find extracted -name settings.gradle.kts -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "Project files not found!"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SPACE-ANTI-CHEAT-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
